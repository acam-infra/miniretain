server:
  addr: "0.0.0.0:18080"
  read_header_timeout_ms: 5000

paths:
  root: "."
  data_dir: "./data/jobs"

runtime:
  python: "python3"
  typst: "typst"
  max_workers: 2
  max_llm_concurrency: 8

target_lang: "zh"

ocr:
  # Supported: auto | pymupdf | mineru | paddle-cloud | paddle-http | paddle-cpu | stub
  provider: "mineru"
  paddle_cloud:
    job_url: "https://paddleocr.aistudio-app.com/api/v2/ocr/jobs"
    model: "PaddleOCR-VL-1.6"
    token_file: "~/.miniretain/paddle_cloud.key"
    proxies: ["direct"]
    fallback_provider: "mineru"
    timeout_s: 300
    poll_interval_s: 3
  mineru:
    base_url: "https://mineru.net"
    model_version: "vlm"
    language: "en"
    token_file: "~/.miniretain/mineru.key"
    proxies: ["direct"]
    fallback_provider: "paddle-cloud"
    timeout_s: 600
    poll_interval_s: 3
  paddle_http:
    base_url: "http://127.0.0.1:18085"
    dpi: 150
    timeout_s: 180
    health_timeout_s: 5
  paddle_cpu:
    dpi: 150
    lang: "en"
  auto:
    scanned_char_threshold: 20
    fallback_provider: "mineru"
  options: {}

llm:
  provider: "openai-compat"
  base_url: "http://100.99.0.3:8083/v1"
  api_key_file: "~/.miniretain/gw2a_key"
  model: "gemini-3.6-flash"
  fallback_models: ["gemini-3.5-flash-lite"]
  proxies: ["direct"]
  batch_size: 18
  concurrency: 8
  max_retries: 2
  timeout_ms: 120000
  allow_partial: false

render:
  enabled: true
  engine: "typst"
  font: ""
  layout_mode: "preserve"
  bilingual_mode: "side_by_side"
  output: "translated.pdf"
  output_cn: "translated_cn.pdf"
  output_merged: "translated_merged.pdf"
  strict: true
